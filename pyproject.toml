[project]
name = "aiogram-webhook-template"
version = "0.1.0"
description = "Durable, observable Telegram webhook bot with aiogram, PostgreSQL and Redis"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiogram>=3.28.2,<4",
  "aiohttp>=3.12,<4",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.10,<3",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0.41,<2.1",
  "structlog>=25,<27",
  "prometheus-client>=0.22,<1",
  "sentry-sdk[aiohttp]>=2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-aiohttp>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Redis (set TEST_DATABASE_URL and TEST_REDIS_URL)"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
