name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.1"
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint
      - run: uv run --frozen pytest -q -m 'not integration'
      - run: make init
      - run: make test-docker
      - run: docker compose build app
      - run: docker compose --profile test down
        if: always()
